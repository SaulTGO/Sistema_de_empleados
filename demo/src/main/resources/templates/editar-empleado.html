<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <div class="container mx-auto px-4 py-10">
        <div class="max-w-xl mx-auto">
            <div class="mb-6">
                <a th:href="@{/empleado}" class="btn btn-ghost btn-sm">← Volver</a>
                <h1 class="mt-4 text-4xl font-bold">Editar empleado</h1>
            </div>

            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <form th:action="@{/empleado/{id}/editar(id=${empleado.id})}" method="post" class="space-y-4">
                        <label class="form-control">
                            <span class="label-text mb-2">Nombre</span>
                            <input type="text" name="nombre" th:value="${empleado.nombre}"
                                class="input input-bordered w-full" required>
                        </label>

                        <label class="form-control">
                            <span class="label-text mb-2">Apellido</span>
                            <input type="text" name="apellido" th:value="${empleado.apellido}"
                                class="input input-bordered w-full" required>
                        </label>

                        <label class="form-control">
                            <span class="label-text mb-2">Email</span>
                            <input type="email" name="email" th:value="${empleado.email}"
                                class="input input-bordered w-full" required>
                        </label>

                        <div class="flex justify-between gap-3 pt-2">
                            <a th:href="@{/empleado}" class="btn btn-ghost">Cancelar</a>
                            <div class="flex gap-3">
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                                <form th:action="@{/empleado/{id}/eliminar(id=${empleado.id})}"
                                    method="post"
                                    onsubmit="return confirm('¿Seguro que deseas eliminar este empleado?');">
                                    <button type="submit" class="btn btn-error">Eliminar</button>
                                </form>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
