<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <div class="container mx-auto px-4 py-10">
        <div class="max-w-xl mx-auto">
            <div class="mb-6">
                <a th:href="@{/Empleados}" class="btn btn-ghost btn-sm">← Volver</a>
                <h1 class="mt-4 text-4xl font-bold">Nuevo empleado</h1>
            </div>

            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <form th:action="@{/nuevo-empleado}" method="post" class="space-y-4">
                        <label class="form-control">
                            <span class="label-text mb-2">Nombre</span>
                            <input type="text" name="nombre" class="input input-bordered w-full" placeholder="Ingrese nombre" required>
                        </label>

                        <label class="form-control">
                            <span class="label-text mb-2">Apellido</span>
                            <input type="text" name="apellido" class="input input-bordered w-full" placeholder="Ingrese apellido" required>
                        </label>

                        <label class="form-control">
                            <span class="label-text mb-2">Email</span>
                            <input type="email" name="email" class="input input-bordered w-full" placeholder="correo@empresa.com" required>
                        </label>

                        <div class="flex justify-end gap-3 pt-2">
                            <a th:href="@{/Empleados}" class="btn btn-ghost">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar empleado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
