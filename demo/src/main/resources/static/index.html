<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de empleados">
    <title>Sistema de empleados</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content" data-theme="corporate">
    <header class="border-b border-base-300 bg-base-100/90 backdrop-blur">
        <nav class="navbar mx-auto max-w-7xl px-6" aria-label="Navegacion principal">
            <div class="flex-1">
                <a href="/" class="text-xl font-black tracking-tight text-primary">
                    NORTE<span class="text-secondary">/</span>
                </a>
            </div>
            <div>
                <a href="/empleados" class="btn btn-primary btn-sm sm:btn-md">
                    Ver empleados
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="relative isolate flex min-h-[calc(100vh-73px)] items-center overflow-hidden px-6 py-20">
            <div class="absolute inset-0 -z-10 bg-gradient-to-br from-primary/10 via-base-200 to-secondary/10"></div>
            <div class="absolute right-[-8rem] top-16 -z-10 h-72 w-72 rounded-full border-[3rem] border-secondary/20"></div>
            <div class="absolute bottom-[-10rem] left-[-6rem] -z-10 h-80 w-80 rounded-full border-[4rem] border-primary/10"></div>

            <div class="mx-auto w-full max-w-7xl">
                <div class="max-w-3xl">
                    <p class="mb-6 inline-flex items-center gap-2 rounded-full border border-primary/20 bg-base-100 px-4 py-2 text-sm font-semibold uppercase tracking-[0.18em] text-primary shadow-sm">
                        <span class="h-2 w-2 rounded-full bg-secondary"></span>
                        Sistema de empleados
                    </p>
                    <h1 class="max-w-3xl text-5xl font-black leading-[0.95] tracking-tight text-primary sm:text-7xl">
                        Work in progess...
                    </h1>
                    <p class="mt-8 max-w-xl text-lg leading-relaxed text-base-content/70 sm:text-xl">
                        Trabajo en proceso, paciencia xfavor
                    </p>
                    <div class="mt-10 flex flex-wrap gap-3">
                        <a href="/empleados" class="btn btn-primary">Ir a empleados</a>
                        <span class="flex items-center px-2 text-sm font-medium text-base-content/60">Proximamente nuevas funciones</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
