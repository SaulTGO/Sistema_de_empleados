<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de empleados">
    <title>Sistema de empleados</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content" data-theme="nord">
    <header class="border-b border-base-300 bg-base-100/90 backdrop-blur">
        <nav class="navbar mx-auto max-w-7xl px-6" aria-label="Navegacion principal">
            <div class="flex-1">
                <a href="/" class="text-xl font-black tracking-tight text-primary">
                    Empleados<span class="text-secondary">/</span>
                </a>
            </div>
            <div>
                <a href="/empleado" class="btn btn-primary btn-sm sm:btn-md">
                    Ver empleados
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="flex min-h-[calc(100vh-73px)] items-center px-6 py-16">
            <div class="mx-auto w-full max-w-7xl">
                <div class="rounded-box bg-primary px-8 py-14 text-primary-content sm:px-14 sm:py-20">
                    <div class="max-w-3xl">
                        <p class="mb-5 text-sm font-bold uppercase tracking-[0.18em] opacity-80">
                            Gestión de personal
                        </p>
                        <h1 class="text-4xl font-black leading-tight sm:text-6xl">
                            Sistema de empleados
                        </h1>
                        <p class="mt-5 max-w-xl text-lg leading-relaxed opacity-85">
                            Administra la información de tus empleados desde un solo lugar.
                        </p>
                        <div class="mt-8">
                            <a href="/empleado" class="btn btn-secondary">Ver empleados</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
